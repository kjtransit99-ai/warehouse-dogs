<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAREHOUSE DOGS | BAR AND COFFEE TRANSIT</title>
  <meta name="description" content="WAREHOUSE DOGS — 70s Noir Social Deduction Game for Bar and Coffee Transit">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Film grain & vignette overlays (strictly below QR z-index: 10000) -->
  <div class="noir-vignette" aria-hidden="true"></div>
  <div class="noir-grain" aria-hidden="true"></div>
  <div id="flash-overlay" class="flash-overlay" aria-hidden="true"></div>

  <!-- Top-right floating controls: Audio Mute (TV) + JP/EN Toggle -->
  <div class="top-controls">
    <button id="audio-toggle-btn" class="ctrl-btn audio-btn hidden" type="button" aria-label="Toggle Sound">
      <svg id="audio-icon-on" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="audio-icon-off" class="hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>
    <button id="lang-toggle-btn" class="ctrl-btn lang-btn" type="button">
      <span id="lang-jp" class="lang-opt active">JP</span>
      <span class="lang-sep">/</span>
      <span id="lang-en" class="lang-opt">EN</span>
    </button>
  </div>

  <!-- Main Application Mount -->
  <main id="app" class="app-root"></main>

  <!-- Firebase Compat SDKs (reliable on mobile Safari & 4G/5G) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <!-- QR Code Generator -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <!-- Game Data & Logic -->
  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
